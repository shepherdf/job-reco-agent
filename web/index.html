<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>求职岗位推荐 Agent</title>
<style>
  :root {
    --ink: #17212b;
    --muted: #637083;
    --line: #e4e9f0;
    --brand: #315efb;
    --brand-2: #22b8a7;
    --bg: #f4f7fb;
    --card: #ffffff;
    --warn: #b45309;
    --warn-bg: #fff7ed;
    --good: #047857;
    --good-bg: #ecfdf5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
    background: radial-gradient(circle at 10% 0%, #e9efff 0, transparent 34%), var(--bg);
    color: var(--ink);
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 28px 22px 60px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
  .brand h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: .5px; }
  .brand p { margin: 0; color: var(--muted); font-size: 14px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; background: #eef3ff; color: #2447c9; border: 1px solid #d7e2ff; padding: 7px 12px; border-radius: 999px; font-size: 12px; white-space: nowrap; }
  .grid { display: grid; grid-template-columns: 420px minmax(0, 1fr); gap: 22px; align-items: start; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 10px 30px rgba(21, 35, 62, .06); }
  form.card { padding: 20px; position: sticky; top: 18px; }
  .form-title { font-size: 16px; font-weight: 700; margin: 0 0 14px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .field input, .field select, .field textarea {
    width: 100%; border: 1px solid #d9e0ea; border-radius: 10px; padding: 10px 11px;
    font: inherit; font-size: 13px; color: var(--ink); background: #fbfcfe; outline: none;
  }
  .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(49, 94, 251, .1); }
  .field textarea { min-height: 74px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin: 8px 0 14px; }
  .actions { display: flex; gap: 10px; }
  button { border: 0; border-radius: 10px; padding: 11px 15px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  .primary { background: linear-gradient(135deg, var(--brand), #5b7cff); color: white; flex: 1; }
  .ghost { background: #eef2f8; color: #344054; }
  button:disabled { opacity: .6; cursor: wait; }
  .hint { margin-top: 12px; font-size: 11px; line-height: 1.7; color: #8a95a6; }
  .results { min-height: 400px; }
  .empty { padding: 46px 30px; text-align: center; color: var(--muted); }
  .empty strong { display: block; color: var(--ink); margin-bottom: 8px; font-size: 18px; }
  .status-card { padding: 16px 18px; margin-bottom: 14px; display: flex; gap: 12px; align-items: flex-start; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--brand); margin-top: 6px; flex: 0 0 auto; }
  .status-card h3 { margin: 0 0 4px; font-size: 15px; }
  .status-card p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.6; }
  .cluster { padding: 16px 18px; margin-bottom: 14px; background: linear-gradient(135deg, #f6f9ff, #fbfdff); }
  .cluster-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .cluster h3 { margin: 0; font-size: 15px; }
  .cluster .meta { color: var(--muted); font-size: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { background: #eef3ff; color: #2946b8; border-radius: 999px; padding: 4px 9px; font-size: 11px; }
  .chip.gray { background: #f1f4f8; color: #556070; }
  .chip.green { background: #e7f8f2; color: #087a5b; }
  .warn { background: var(--warn-bg); border: 1px solid #fed7aa; color: var(--warn); padding: 12px 14px; border-radius: 12px; font-size: 12px; line-height: 1.7; margin-bottom: 14px; }
  .questions { background: #f6f8fc; border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin-bottom: 14px; font-size: 13px; line-height: 1.9; }
  .rec { padding: 18px 19px; margin-bottom: 13px; }
  .rec-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .rec-title { font-size: 16px; font-weight: 800; margin: 0 0 3px; }
  .rec-sub { color: var(--muted); font-size: 12px; }
  .score { text-align: right; flex: 0 0 auto; }
  .score .num { font-size: 20px; font-weight: 800; color: var(--brand); }
  .score .lab { font-size: 11px; color: var(--muted); }
  .rec-meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 11px 0 8px; font-size: 12px; color: #475467; }
  .rec-meta span { background: #f5f7fb; border-radius: 7px; padding: 5px 8px; }
  .explain { font-size: 13px; line-height: 1.85; color: #344054; margin: 8px 0 10px; }
  .evidence { font-size: 11px; line-height: 1.7; color: #667085; border-top: 1px dashed var(--line); padding-top: 9px; }
  .rec-actions { display: flex; gap: 8px; margin-top: 10px; }
  .rec-actions button { padding: 7px 11px; font-size: 11px; font-weight: 600; }
  .like { background: var(--good-bg); color: var(--good); }
  .skip { background: #f3f4f6; color: #667085; }
  .trace { padding: 0; overflow: hidden; margin-top: 14px; }
  .trace summary { cursor: pointer; padding: 14px 18px; font-size: 13px; font-weight: 700; color: #344054; }
  .trace-body { padding: 0 18px 16px; }
  .trace-row { display: grid; grid-template-columns: 170px 90px 1fr; gap: 10px; font-size: 11px; padding: 7px 0; border-top: 1px solid #f0f3f7; color: #667085; }
  .trace-row b { color: #344054; }
  .loading { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.4); border-top-color: white; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } form.card { position: static; } header { align-items: flex-start; flex-direction: column; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>求职岗位推荐 Agent</h1>
      <p>用户分群 + 内容/协同混合推荐 + 可解释证据 + 人工确认</p>
    </div>
    <div class="badge">离线原型 · 不自动投递 · 数据为合成/脱敏</div>
  </header>

  <div class="grid">
    <form class="card" id="form">
      <p class="form-title">你的求职画像</p>
      <div class="row">
        <div class="field">
          <label>当前城市</label>
          <select id="city">
            <option>杭州</option><option>北京</option><option>上海</option><option>深圳</option>
            <option>广州</option><option>成都</option><option>武汉</option><option>南京</option>
            <option>西安</option><option>苏州</option><option>重庆</option><option>长沙</option>
          </select>
        </div>
        <div class="field">
          <label>目标城市（逗号分隔）</label>
          <input id="target_cities" value="杭州,上海">
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label>期望月薪（k）</label>
          <input id="expected_salary" type="number" min="3" max="100" step="0.5" value="12">
        </div>
        <div class="field">
          <label>工作经验（年）</label>
          <input id="experience_years" type="number" min="0" max="40" step="1" value="0">
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label>最高学历</label>
          <select id="education"><option>本科</option><option>大专</option><option>硕士</option><option>博士</option></select>
        </div>
        <div class="field">
          <label>目标方向</label>
          <select id="preferred_families">
            <option value="data">数据分析</option>
            <option value="algorithm">算法/机器学习</option>
            <option value="backend">后端开发</option>
            <option value="frontend">前端开发</option>
            <option value="product">产品经理</option>
            <option value="operations">运营</option>
            <option value="design">设计</option>
            <option value="qa">测试/质量</option>
            <option value="devops">运维/DevOps</option>
            <option value="hr">人力资源</option>
            <option value="finance">财务/会计</option>
            <option value="sales">销售/市场</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>核心技能（用顿号或逗号分隔）</label>
        <input id="skills" value="SQL,Python,Excel,Pandas,统计分析,数据可视化">
      </div>
      <label class="check"><input id="remote_pref" type="checkbox"> 接受/偏好远程岗位</label>
      <div class="field">
        <label>一句话介绍（可选）</label>
        <textarea id="bio">应届本科，统计学专业，做过课程数据分析和一段报表实习。</textarea>
      </div>
      <div class="actions">
        <button class="primary" id="submit" type="submit">开始推荐</button>
        <button class="ghost" type="button" id="demo">加载示例</button>
      </div>
      <div class="hint">模型会先做城市/薪资/学历/经验硬约束过滤，再用学习排序给出 Top-10；低置信度或约束冲突会提示人工复核。</div>
    </form>

    <section class="results" id="results">
      <div class="card empty">
        <strong>输入画像，获取可解释的岗位推荐</strong>
        推荐结果会展示分群、匹配技能、约束证据、置信度和执行轨迹。
      </div>
    </section>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const splitList = (s) => s.split(/[,\uFF0C\u3001|;；]+/).map(x => x.trim()).filter(Boolean);

function payload() {
  return {
    city: $("city").value,
    target_cities: splitList($("target_cities").value),
    expected_salary: Number($("expected_salary").value),
    experience_years: Number($("experience_years").value),
    education: $("education").value,
    remote_pref: $("remote_pref").checked,
    skills: splitList($("skills").value),
    preferred_families: [$("preferred_families").value],
    bio: $("bio").value
  };
}

function renderChips(items, cls = "") {
  return `<div class="chips">${items.map(x => `<span class="chip ${cls}">${esc(x)}</span>`).join("")}</div>`;
}

function renderResponse(data) {
  const box = $("results");
  if (data.status === "need_more_info") {
    box.innerHTML = `
      <div class="card status-card"><div class="status-dot"></div><div><h3>还需要补充信息</h3><p>${esc(data.message || "")}</p></div></div>
      <div class="questions"><b>请补充：</b><br>${(data.questions || []).map(q => "· " + esc(q)).join("<br>")}</div>
      ${renderTrace(data.trace)}
    `;
    return;
  }
  if (data.status !== "ok") {
    box.innerHTML = `
      <div class="card status-card"><div class="status-dot" style="background:#b45309"></div><div><h3>${data.status === "no_match" ? "暂无匹配岗位" : "处理失败"}</h3><p>${esc(data.message || "")}</p></div></div>
      ${(data.questions || []).length ? `<div class="questions"><b>可以尝试：</b><br>${data.questions.map(q => "· " + esc(q)).join("<br>")}</div>` : ""}
      ${(data.warnings || []).length ? `<div class="warn">${data.warnings.map(esc).join("<br>")}</div>` : ""}
      ${renderTrace(data.trace)}
    `;
    return;
  }
  const c = data.cluster || {};
  const recs = data.recommendations || [];
  const recHtml = recs.map(rec => {
    const ev = rec.evidence || {};
    const matched = (ev.matched_skills || []).slice(0, 6);
    const missing = (ev.missing_skills || []).slice(0, 4);
    return `
      <article class="card rec">
        <div class="rec-head">
          <div>
            <p class="rec-title">${rec.rank}. ${esc(rec.title)}</p>
            <div class="rec-sub">${esc(rec.company)} · ${esc(rec.city)} · ${esc(rec.family)} · ${esc(rec.education)}及以上 · ${rec.experience_min}年经验</div>
          </div>
          <div class="score"><div class="num">${rec.score.toFixed(3)}</div><div class="lab">匹配度 ${esc(rec.match_level)}</div></div>
        </div>
        <div class="rec-meta">
          <span>薪资 ${esc(rec.salary)}</span>
          <span>${rec.remote ? "支持远程" : "到岗办公"}</span>
          <span>${rec.skills.length} 项技能要求</span>
        </div>
        <div class="explain">${esc(rec.explanation)}</div>
        ${matched.length ? `<div class="evidence"><b>匹配技能：</b>${matched.map(s => `<span class="chip green">${esc(s)}</span>`).join(" ")}</div>` : ""}
        ${missing.length ? `<div class="evidence"><b>待补技能：</b>${missing.map(s => `<span class="chip gray">${esc(s)}</span>`).join(" ")}</div>` : ""}
        <div class="rec-actions">
          <button class="like" onclick="feedback('${esc(data.session_id)}','${esc(rec.job_id)}','like',this)">感兴趣</button>
          <button class="skip" onclick="feedback('${esc(data.session_id)}','${esc(rec.job_id)}','skip',this)">跳过</button>
        </div>
      </article>
    `;
  }).join("");
  box.innerHTML = `
    <div class="card status-card"><div class="status-dot" style="background:#22b8a7"></div><div><h3>${esc(data.message || "推荐完成")}</h3><p>整体置信度：${esc(data.confidence || "-")} · 用时 ${Number(data.latency_ms || 0).toFixed(1)} ms · 不会自动投递</p></div></div>
    <div class="card cluster">
      <div class="cluster-head"><h3>你的分群：${esc(c.name || "-")}</h3><span class="meta">${c.size || 0} 人</span></div>
      <div class="meta">常见方向：${esc((c.top_preferred_families || []).join("、"))}</div>
      ${renderChips((c.top_skills || []).slice(0, 5))}
    </div>
    ${(data.warnings || []).length ? `<div class="warn">${data.warnings.map(esc).join("<br>")}</div>` : ""}
    ${recHtml}
    ${renderTrace(data.trace)}
  `;
}

function renderTrace(trace) {
  if (!trace || !trace.length) return "";
  return `<details class="card trace"><summary>执行轨迹（${trace.length} 步）</summary><div class="trace-body">
    ${trace.map(s => `<div class="trace-row"><b>${esc(s.step)}</b><span>${esc(s.status)}</span><span>${s.elapsed_ms} ms ${esc(JSON.stringify(s.detail || {}).slice(0, 160))}</span></div>`).join("")}
  </div></details>`;
}

async function recommend() {
  const btn = $("submit");
  btn.disabled = true;
  btn.innerHTML = '<span class="loading"></span>推荐中';
  try {
    const resp = await fetch("/api/recommend", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload())});
    const data = await resp.json();
    renderResponse(data);
  } catch (e) {
    $("results").innerHTML = `<div class="card status-card"><div class="status-dot" style="background:#b45309"></div><div><h3>请求失败</h3><p>${esc(e.message)}</p></div></div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = "开始推荐";
  }
}

async function feedback(sessionId, jobId, action, btn) {
  btn.disabled = true;
  try {
    const resp = await fetch("/api/feedback", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({session_id: sessionId, job_id: jobId, action})});
    const data = await resp.json();
    btn.textContent = data.status === "ok" ? "已记录" : "记录失败";
  } catch (e) {
    btn.textContent = "记录失败";
  }
}

$("form").addEventListener("submit", (e) => { e.preventDefault(); recommend(); });
$("demo").addEventListener("click", () => {
  $("city").value = "杭州";
  $("target_cities").value = "杭州,上海";
  $("expected_salary").value = 12;
  $("experience_years").value = 0;
  $("education").value = "本科";
  $("preferred_families").value = "data";
  $("skills").value = "SQL,Python,Excel,Pandas,统计分析,数据可视化";
  $("remote_pref").checked = false;
  $("bio").value = "应届本科，统计学专业，做过课程数据分析和一段报表实习，希望找数据分析方向的工作。";
  recommend();
});

if (new URLSearchParams(location.search).get("demo") === "1") {
  window.addEventListener("load", () => setTimeout(() => { $("demo").click(); }, 300));
}
</script>
</body>
</html>
